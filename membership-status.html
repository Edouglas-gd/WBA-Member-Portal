<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Progress - WBA Member Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <header class="app-header">
        <img src="images/wba-icon.png" alt="Working Beauceron Association" class="app-logo">
        <h1>WBA Member Portal</h1>
    </header>

    <nav class="member-nav" aria-label="Account navigation">
        <a href="membership-status.html" aria-current="page">Membership Progress</a>
        <button type="button" id="logoutButton">Log Out</button>
    </nav>

    <main class="app-content membership-status-page">
        <p id="membershipStatusAccessMessage" class="profile-muted" role="status">
            Loading your membership progress...
        </p>

        <section id="membershipProgress" hidden>
            <div class="application-heading-card">
                <p class="dashboard-eyebrow">Membership Progress</p>
                <h2 id="membershipProgressHeading">Your WBA Membership</h2>
                <p id="membershipProgressMessage"></p>
            </div>

            <section class="membership-progress-card" aria-labelledby="progressDetailsHeading">
                <h3 id="progressDetailsHeading">Current Status</h3>
                <dl class="membership-progress-details">
                    <div id="progressApplicationStatusDetail">
                        <dt>Application</dt>
                        <dd id="progressApplicationStatus">—</dd>
                    </div>
                    <div id="progressMembershipStatusDetail">
                        <dt>Membership</dt>
                        <dd id="progressMembershipStatus">—</dd>
                    </div>
                    <div id="progressSponsorStatusDetail" hidden>
                        <dt>Sponsor</dt>
                        <dd id="progressSponsorStatus">Sponsor Request Pending</dd>
                    </div>
                </dl>
            </section>

            <section class="membership-progress-card" id="membershipProgressNextStep">
                <h3>Next Step</h3>
                <p id="membershipProgressNextStepMessage"></p>
            </section>

            <section class="membership-progress-card application-revision-panel" id="applicationRevisionPanel" hidden>
                <h3>Requested Changes</h3>
                <p id="applicationRevisionRequestMessage"></p>
                <a class="button-link" href="membership-application.html">Edit Application</a>
            </section>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
