<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Administration - WBA Member Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <header class="app-header">
        <img src="images/wba-icon.png" alt="Working Beauceron Association" class="app-logo">
        <h1>Membership Administration</h1>
    </header>

    <nav class="member-nav" aria-label="Admin navigation">
        <a href="dashboard.html">Member Dashboard</a>
        <a href="admin.html">Admin Dashboard</a>
        <a href="admin-members.html" aria-current="page">Membership</a>
        <button type="button" id="logoutButton">Log Out</button>
    </nav>

    <main class="app-content admin-members-page">
        <p id="adminMemberAccessMessage" class="profile-muted" role="status">
            Verifying administrator access...
        </p>

        <section id="adminMemberDirectory" hidden>
            <div class="admin-page-heading">
                <p class="dashboard-eyebrow">Secure administration</p>
                <h2>Membership Accounts</h2>
                <p>Review accounts and open an individual record to manage WBA membership information.</p>
            </div>

            <div class="admin-search-field">
                <label for="adminMemberSearchInput">Search Accounts</label>
                <input
                    type="search"
                    id="adminMemberSearchInput"
                    placeholder="Search by name, email, or member ID"
                    autocomplete="off"
                >
            </div>

            <div class="form-field admin-members-filter">
                <label for="adminMemberFilter">Show Accounts</label>
                <select id="adminMemberFilter">
                    <option value="all">All Members</option>
                    <option value="dues">Dues Attention</option>
                </select>
            </div>

            <p id="adminMemberMessage" class="profile-muted" role="status">
                Loading membership accounts...
            </p>
            <div class="admin-table-container">
                <table class="admin-members-table">
                    <thead>
                        <tr>
                            <th scope="col" aria-sort="ascending"><button type="button" class="admin-sort-button" data-admin-sort="member">Member <span aria-hidden="true">▲</span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="admin-sort-button" data-admin-sort="memberId">Member ID <span aria-hidden="true"></span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="admin-sort-button" data-admin-sort="email">Email <span aria-hidden="true"></span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="admin-sort-button" data-admin-sort="status">Status <span aria-hidden="true"></span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="admin-sort-button" data-admin-sort="type">Type <span aria-hidden="true"></span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="admin-sort-button" data-admin-sort="memberSince">Member Since <span aria-hidden="true"></span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="admin-sort-button" data-admin-sort="currentThrough">Current Through <span aria-hidden="true"></span></button></th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminMemberTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>

</html>
