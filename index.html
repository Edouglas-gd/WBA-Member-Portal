<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>WBA Member Portal</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">


</head>

<body>


<header class="app-header">
    <img src="images/wba-icon.png" alt="Working Beauceron Association" class="app-logo">
    <h1>WBA Member Portal</h1>
</header>

<main class="app-content">

    <section class="welcome-card">

        <h2>Working Beauceron Association</h2>

        <p>
            Welcome to the WBA Member Portal.
        </p>

        <p>
            Members can log in to access their account and WBA resources.
        </p>

        <div class="auth-buttons">
            <button id="loginButton">Log In</button>
            <button id="createAccountButton">Create an Account</button>
        </div>

        <p id="message"></p>

    </section>

</main>


<script type="module" src="app.js"></script>



</body>
</html>
