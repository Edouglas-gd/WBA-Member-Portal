<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - WBA Member Portal</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <header class="app-header">
        <img src="images/wba-icon.png"
             alt="Working Beauceron Association"
             class="app-logo">

        <h1>WBA Member Portal</h1>
    </header>

    <main class="app-content">

        <section class="welcome-card">

            <h2>Log In</h2>

            <p>
                Log in to access your WBA Member Portal account.
            </p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Log In</button>

            </form>

            <div id="message" role="alert"></div>

            <div id="verificationOptions" style="display: none;">

                <p>
                    Your email address has not been verified yet.
                </p>

                <button id="resendVerificationButton">
                    Resend Verification Email
                </button>

                <button id="refreshVerificationButton">
                    I've Verified My Email
                </button>

                <a
                    href="membership-application.html"
                    class="profile-action-button"
                    id="continueMembershipApplicationLink"
                >
                    Continue Membership Application
                </a>

            </div>

            <p>
                <a href="#" id="forgotPasswordLink">
                    Forgot your password?
                </a>
            </p>

            <p>
                Don't have an account?
                <a href="create-account.html">Create an Account</a>
            </p>

            <p>
                <a href="index.html">Return to WBA Member Portal</a>
            </p>

        </section>

    </main>

    <script type="module" src="app.js"></script>

</body>
</html>
